[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakcheck"
version = "0.4.1"
description = "Local file safety assistant: monitor project changes, detect broken references and find duplicate files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
breakcheck = "breakcheck.__main__:main"

[tool.setuptools]
packages = ["breakcheck"]
