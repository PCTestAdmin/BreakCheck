[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakcheck"
version = "0.3.0"
description = "Know what breaks before you break it: read-only file dependency analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
breakcheck = "breakcheck.__main__:main"

[tool.setuptools]
packages = ["breakcheck"]
