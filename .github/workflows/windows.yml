name: Windows packages
on:
  push:
    branches: [main]
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Start-BreakCheck.cmd'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Start-BreakCheck.cmd'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - id: version
        shell: pwsh
        run: |
          $version = python -c "from breakcheck import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build desktop, CLI and installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Smoke test packaged applications and installer
        shell: pwsh
        timeout-minutes: 8
        run: ./packaging/smoke-windows.ps1
      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: |
            release/BreakCheck-Setup.exe
            release/BreakCheck-Portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build and smoke-test portable Python application
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python packaging/build-headless.py
          python release/BreakCheck.pyz --version
          BREAKCHECK_STATE_DIR="$RUNNER_TEMP/breakcheck-headless" python release/BreakCheck.pyz watch examples/demo --once --json --poll
          python release/BreakCheck.pyz duplicates examples/demo --json
          export BREAKCHECK_STATE_DIR="$RUNNER_TEMP/breakcheck-recovery"
          project="$RUNNER_TEMP/recovery-project"
          mkdir -p "$project"
          printf 'recovery test' > "$project/original.txt"
          python release/BreakCheck.pyz recovery capture "$project"
          version=$(python release/BreakCheck.pyz recovery list | python -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          rm "$project/original.txt"
          python release/BreakCheck.pyz recovery restore "$version" "$project/original.txt"
          test "$(cat "$project/original.txt")" = 'recovery test'
          if python release/BreakCheck.pyz recovery restore "$version" "$project/original.txt"; then exit 1; fi
          printf '<img src="missing.png">' > "$project/index.html"
          token=$(python release/BreakCheck.pyz repair preview "$project" index.html missing.png original.txt | python -c 'import json,sys; print(json.load(sys.stdin)["confirm"])')
          repair=$(python release/BreakCheck.pyz repair apply "$project" index.html missing.png original.txt --confirm "$token" | python -c 'import json,sys; print(json.load(sys.stdin)["repair_id"])')
          grep -q 'original.txt' "$project/index.html"
          python release/BreakCheck.pyz repair undo "$repair" --yes
          grep -q 'missing.png' "$project/index.html"
          set +e
          python release/BreakCheck.pyz check examples/demo assets/logo.svg --json
          code=$?
          set -e
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: breakcheck-headless
          path: release/BreakCheck.pyz
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: breakcheck-headless
          path: release
      - name: Publish versioned release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          (cd release && sha256sum -c SHA256SUMS.txt && sha256sum BreakCheck.pyz >> SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving existing assets unchanged."
            exit 0
          fi
          gh release create "$tag" release/BreakCheck-Setup.exe release/BreakCheck-Portable.zip release/BreakCheck.pyz release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "BreakCheck $VERSION" --latest \
            --notes "New to BreakCheck? Download BreakCheck-Setup.exe and run it. No Python, terminal, or administrator rights required. Or extract BreakCheck-Portable.zip and open BreakCheck.exe. SHA-256 checksums are included. Binaries are unsigned. Windows x64; review scan coverage before making changes."
