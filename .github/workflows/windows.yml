name: Windows packages
on:
  push:
    branches: [main]
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Start-BreakCheck.cmd'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'deploy/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Start-BreakCheck.cmd'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - id: version
        shell: pwsh
        run: |
          $version = python -c "from breakcheck import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build desktop, CLI and installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Smoke test packaged applications and installer
        shell: pwsh
        timeout-minutes: 8
        run: ./packaging/smoke-windows.ps1
      - name: Smoke test packaged Fleet server and agent
        shell: pwsh
        timeout-minutes: 3
        run: python packaging/smoke-fleet.py dist/BreakCheckCLI.exe
      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: |
            release/BreakCheck-Setup.exe
            release/BreakCheck-Portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build and smoke-test portable Python application
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python packaging/build-headless.py
          python release/BreakCheck.pyz --version
          python packaging/smoke-fleet.py python release/BreakCheck.pyz
          BREAKCHECK_STATE_DIR="$RUNNER_TEMP/breakcheck-headless" python release/BreakCheck.pyz watch examples/demo --once --json --poll
          python release/BreakCheck.pyz duplicates examples/demo --json
          python release/BreakCheck.pyz storage examples/demo --json | python -c 'import json,sys; r=json.load(sys.stdin); assert r["files"] > 0 and r["complete"]'
          export BREAKCHECK_STATE_DIR="$RUNNER_TEMP/breakcheck-recovery"
          project="$RUNNER_TEMP/recovery-project"
          mkdir -p "$project"
          printf 'recovery test' > "$project/original.txt"
          python release/BreakCheck.pyz recovery capture "$project"
          version=$(python release/BreakCheck.pyz recovery list | python -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          rm "$project/original.txt"
          python release/BreakCheck.pyz recovery restore "$version" "$project/original.txt"
          test "$(cat "$project/original.txt")" = 'recovery test'
          if python release/BreakCheck.pyz recovery restore "$version" "$project/original.txt"; then exit 1; fi
          printf '<img src="missing.png">' > "$project/index.html"
          token=$(python release/BreakCheck.pyz repair preview "$project" index.html missing.png original.txt | python -c 'import json,sys; print(json.load(sys.stdin)["confirm"])')
          repair=$(python release/BreakCheck.pyz repair apply "$project" index.html missing.png original.txt --confirm "$token" | python -c 'import json,sys; print(json.load(sys.stdin)["repair_id"])')
          grep -q 'original.txt' "$project/index.html"
          python release/BreakCheck.pyz repair undo "$repair" --yes
          grep -q 'missing.png' "$project/index.html"
          token=$(python release/BreakCheck.pyz guard preview "$project" original.txt --destination moved.txt | python -c 'import json,sys; print(json.load(sys.stdin)["confirm"])')
          python release/BreakCheck.pyz guard apply "$project" original.txt --destination moved.txt --confirm "$token"
          test ! -e "$project/original.txt"
          test "$(cat "$project/moved.txt")" = 'recovery test'
          set +e
          python release/BreakCheck.pyz check examples/demo assets/logo.svg --json
          code=$?
          set -e
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: breakcheck-headless
          path: release/BreakCheck.pyz
          if-no-files-found: error
  fleet-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build container and test local dashboard
        shell: bash
        run: |
          set -euo pipefail
          admin=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          agent=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          printf 'BREAKCHECK_ADMIN_TOKEN=%s\nBREAKCHECK_AGENT_TOKENS={"smoke":"%s"}\n' "$admin" "$agent" > deploy/fleet.env
          trap 'docker compose -f deploy/compose.yaml down -v; rm -f deploy/fleet.env' EXIT
          docker compose -f deploy/compose.yaml up -d --build
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $admin" http://127.0.0.1:8765/api/v1/status > /tmp/fleet-status.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("/tmp/fleet-status.json"))["agents"][0]["status"] == "Never seen"'
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, headless, fleet-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: breakcheck-headless
          path: release
      - name: Publish versioned release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          (cd release && sha256sum -c SHA256SUMS.txt && sha256sum BreakCheck.pyz >> SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving existing assets unchanged."
            exit 0
          fi
          gh release create "$tag" release/BreakCheck-Setup.exe release/BreakCheck-Portable.zip release/BreakCheck.pyz release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "BreakCheck $VERSION" --latest \
            --notes "New to BreakCheck? Download BreakCheck-Setup.exe and run it. No Python, terminal, or administrator rights required. Or extract BreakCheck-Portable.zip and open BreakCheck.exe. SHA-256 checksums are included. Binaries are unsigned. Windows x64; review scan coverage before making changes."
