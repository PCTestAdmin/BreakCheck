name: Windows packages
on:
  push:
    branches: [main]
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'breakcheck/**'
      - 'packaging/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - id: version
        shell: pwsh
        run: |
          $version = python -c "from breakcheck import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build desktop, CLI and installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Smoke test packaged applications and installer
        shell: pwsh
        run: ./packaging/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: breakcheck-windows-x64
          path: release
      - name: Publish versioned release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving existing assets unchanged."
            exit 0
          fi
          gh release create "$tag" release/*.exe release/*.zip release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "BreakCheck $VERSION" \
            --notes "Windows x64 installer and portable package. Includes desktop and CLI binaries. Optional Explorer integration. SHA-256 checksums provided. Binaries are not code-signed. Early-stage read-only analyzer; review coverage before making changes."
